# Сервис задач. Подключается к сети CRM (crm_crm), использует её Postgres и Kafka.
# Перед запуском должны быть подняты контейнеры CRM: `make up` (БД) или `make up-kafka` (БД + Kafka) в папке crm.
name: crm-tasks

services:
  backend:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://crm:crm@postgres:5432/crm?sslmode=disable"
      CRM_SCHEMA: "public"
      CRM_URL: "${CRM_URL:-http://localhost}"
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_BROKERS: "broker:9092"
      KAFKA_TOPIC: "crm-tasks.task.create"
      KAFKA_DLQ_TOPIC: "crm-tasks.task.create.dlq"
      KAFKA_GROUP_ID: "crm-tasks"
      SEED_DEMO: "true"
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    restart: unless-stopped
    networks: [crm]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT:-8091}:80"
    restart: unless-stopped
    networks: [crm]

networks:
  crm:
    name: crm_crm
    external: true
